    <!-- Corrected Form Redirection Script -->
    <script>
        document.getElementById('ribbit-form').addEventListener('submit', function(event) {
            // Prevent the default browser form submission page reload
            event.preventDefault(); 
            
            // Get user query and trim empty spaces
            const query = document.getElementById('search-query').value.trim();
            
            if (query) {
                // FIX: Using precise template strings with backticks `` and ${}
                const searchUrl = `https://duckduckgo.com{encodeURIComponent(query)}`;
                
                // Redirect user seamlessly to results
                window.location.href = searchUrl;
            }
        });
    </script>
